<div gs-component="button">
    <!-- 
        Accepts variables:
        - variant: 'primary', 'secondary', 'danger'
        - text: Button text 
        - onClick: Click handler
    -->
    <button class="gs-btn gs-btn-{{ .variant | default:'primary' }}" gs-click="{{ .onClick | default:'' }}">
        {{ .text | default:'' }}
    </button>
</div>
