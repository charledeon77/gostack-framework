<div gs-component="modal">
    <!-- Overlay -->
    <div class="gs-modal-overlay gs-hidden" id="gs-modal-{{ .id | required }}" data-modal-id="{{ .id | required }}">
        <!-- Modal Dialog -->
        <div class="gs-modal-content">
            <div class="gs-modal-header">
                <h3 class="gs-modal-title">{{ .title | default:'' }}</h3>
                <button class="gs-modal-close" gs-click="GoStack.closeModal('{{ .id | required }}')">&times;</button>
            </div>
            
            <div class="gs-modal-body">
                {{ .content | default:'' }}
            </div>
            
            <div class="gs-modal-footer">
                {{ .footer | default:"" }}
            </div>
        </div>
    </div>
</div>
